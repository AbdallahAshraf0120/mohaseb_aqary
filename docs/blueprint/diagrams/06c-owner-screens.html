<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App 1 screen flow</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#475569}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#020617;--fg:#e2e8f0;--mut:#94a3b8}}
:root[data-theme=dark]{--bg:#020617;--fg:#e2e8f0;--mut:#94a3b8}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;padding:24px 16px}
main{max-width:1200px;margin:0 auto} h1{font-size:20px} p{color:var(--mut)}
button{float:right;padding:6px 12px;border-radius:8px;border:1px solid var(--mut);background:transparent;color:var(--fg);cursor:pointer}
.wrap{overflow-x:auto}
</style></head><body><main>
<button onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Toggle theme</button>

nues /</text><text x="775.0" y="108.0" class="s" text-anchor="middle">expenses</text><text x="995.0" y="87.0" class="t" text-anchor="middle">Approval detail</text><text x="995.0" y="102.0" class="s" text-anchor="middle">approve / reject</text><text x="775.0" y="287.0" class="t" text-anchor="middle">Settlement</text><text x="775.0" y="302.0" class="s" text-anchor="middle">profit + partners</text><text x="995.0" y="287.0" class="t" text-anchor="middle">Cashbox feed</text><text x="995.0" y="302.0" class="s" text-anchor="middle">latest movements</text><text x="555.0" y="347.0" class="t" text-anchor="middle">Notifications</text><text x="555.0" y="362.0" class="s" text-anchor="middle">push history</text><rect x="651.7" y="131.0" width="26.6" height="15" rx="3" class="lblbg"/><text x="665.0" y="142.0" class="lbl" text-anchor="middle">tab</text><rect x="651.7" y="231.0" width="26.6" height="15" rx="3" class="lblbg"/><text x="665.0" y="242.0" class="lbl" text-anchor="middle">tab</text></svg></div>

:root[data-theme=light] .dg .s,:root[data-theme=light] .dg .gl{fill:#475569}:root[data-theme=light] .dg .core{fill:#eef2ff;stroke:#4f46e5}
:root[data-theme=light] .dg .shared{fill:#ecfdf5;stroke:#059669}:root[data-theme=light] .dg .new{fill:#fff7ed;stroke:#ea580c}
:root[data-theme=light] .dg .ext{fill:#f1f5f9;stroke:#64748b}:root[data-theme=light] .dg .db{fill:#fefce8;stroke:#ca8a04}
:root[data-theme=light] .dg .client{fill:#f0f9ff;stroke:#0284c7}:root[data-theme=light] .dg .ln,:root[data-theme=light] .dg .lnd{stroke:#334155}
:root[data-theme=light] .dg .ah{fill:#334155}:root[data-theme=light] .dg .lbl{fill:#1e293b}:root[data-theme=light] .dg .lblbg{fill:#fff}
:root[data-theme=light] .dg .note{fill:#fffbeb;stroke:#d97706}`;document.head.appendChild(s);})();</script>
</main></body></html>
